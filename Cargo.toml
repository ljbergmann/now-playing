[package]
name = "now-playing"
version = "0.4.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
libc = "0.2.191"
md5 = "0.7"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
tiny_http = "0.12.0"
ureq = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# "x11" only satisfies minifb's build-script check (it misses *-apple-darwin); macOS uses Cocoa.
minifb = { version = "0.29.0", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.15.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
