[package]
name = "now-playing"
version = "0.5.1"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
libc = "0.2.191"
md5 = "0.7"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
tiny_http = "0.12.0"
ureq = "2"

# The desktop window (Mac, Windows, Linux with a desktop). Pi builds leave it
# out (`--no-default-features`) and draw straight to the screen (DRM/KMS).
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
getrandom = "0.3"

[features]
default = ["desktop"]
desktop = ["dep:winit", "dep:softbuffer", "dep:muda", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:objc2-authentication-services", "dep:block2", "dep:windows-sys", "dep:wry"]

# Menus (menu bar on the Mac, right-click menu on Windows). Not on Linux:
# there muda needs GTK; the Linux window uses keys instead.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.21", optional = true }

# The native settings window on the Mac (AppKit). Same versions muda uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-app-kit = { version = "0.3", optional = true }
objc2-authentication-services = { version = "0.3", optional = true }
block2 = { version = "0.6", optional = true }

# The native settings window on Windows (Win32), and its VinylVault sign-in
# window (WebView2, preinstalled on Windows 10/11).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
wry = { version = "0.57", optional = true, default-features = false, features = ["os-webview"] }

[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.15.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
